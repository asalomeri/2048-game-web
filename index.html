<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="title-area">
        <h1 class="game-title">2048</h1>
        <p class="game-subtitle">Join the tiles, get to <strong>2048!</strong></p>
      </div>
      <div class="scores-area">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
          <span class="score-delta" id="score-delta" aria-hidden="true"></span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="controls-left">
        <button class="btn-icon" id="dark-mode-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        <button class="btn-icon" id="undo-btn" title="Undo last move (Z)" aria-label="Undo last move" disabled>↩</button>
      </div>
      <div class="controls-right">
        <p class="hint-text">Arrow keys / WASD / Swipe</p>
        <button class="btn-new-game" id="new-game-btn">New Game</button>
      </div>
    </div>

    <!-- Game Status Message -->
    <div class="game-message" id="game-message" aria-live="polite">
      <span id="message-text"></span>
      <div class="message-actions">
        <button class="btn-keep-playing" id="keep-playing-btn" style="display:none;">Keep Playing</button>
        <button class="btn-try-again" id="try-again-btn" style="display:none;">Try Again</button>
      </div>
    </div>

    <!-- Game Board -->
    <div class="board-container">
      <div class="board" id="board" role="grid" aria-label="2048 game board">
        <!-- 16 cells generated by JS -->
      </div>
    </div>

    <!-- Instructions -->
    <footer class="instructions">
      <p><strong>HOW TO PLAY:</strong> Use <strong>arrow keys</strong> or <strong>WASD</strong> to move the tiles.
        Tiles with the same number <strong>merge into one</strong> when they touch.
        Add them up to reach <strong>2048!</strong>
        Press <strong>Z</strong> to undo, <strong>R</strong> for a new game.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
